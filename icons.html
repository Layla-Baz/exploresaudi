<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Darbak 2030 Icons</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div>
  <i class="fas fa-map-marked-alt icon"></i>
  <span class="label">Map</span>
</div>

<div>
  <i class="fas fa-location-dot icon secondary"></i>
  <span class="label">Location</span>
</div>

<div>
  <i class="fas fa-suitcase-rolling icon"></i>
  <span class="label">Trip</span>
</div>

<div>
  <i class="fas fa-star icon secondary"></i>
  <span class="label">Rating</span>
</div>

<div>
  <i class="fas fa-search icon"></i>
  <span class="label">Search</span>
</div>

<div>
  <i class="fas fa-heart icon secondary"></i>
  <span class="label">Favorites</span>
</div>

<div>
  <i class="fas fa-user icon"></i>
  <span class="label">Profile</span>
</div>

</html>
